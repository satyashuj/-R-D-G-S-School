


<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RDGS Enquiry Form</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,#021526,#03346E,#004AAD);

    overflow:hidden;

    padding:20px;
}

/* LIGHT EFFECT */

.light{
    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    opacity:0.3;
}

.light1{
    width:220px;
    height:220px;

    background:#00ffd0;

    top:-60px;
    left:-40px;
}

.light2{
    width:260px;
    height:260px;

    background:#007bff;

    bottom:-90px;
    right:-70px;
}

/* MAIN CONTAINER */

.form-container{
    position:relative;

    width:100%;
    max-width:950px;

    display:grid;
    grid-template-columns:1fr 1fr;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(20px);

    border-radius:25px;

    overflow:hidden;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.35);

    z-index:5;
}

/* LEFT PANEL */

.left-panel{
    padding:40px;

    background:
    linear-gradient(160deg,#00a884,#005f73);

    color:white;
}

.school-badge{
    width:70px;
    height:70px;

    background:white;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:30px;

    color:#00a884;

    margin-bottom:20px;
}

.left-panel h1{
    font-size:38px;

    line-height:50px;

    margin-bottom:15px;
}

.left-panel p{
    font-size:16px;

    line-height:28px;
}

/* INFO */

.info-boxes{
    margin-top:35px;

    display:flex;
    flex-direction:column;

    gap:18px;
}

.info-item{
    display:flex;
    align-items:center;

    gap:15px;

    background:rgba(255,255,255,0.12);

    padding:14px;

    border-radius:14px;
}

.info-item i{
    font-size:18px;
}

.info-item span{
    font-size:15px;
}

/* RIGHT PANEL */

.right-panel{
    padding:40px;

    background:white;
}

.form-title{
    font-size:30px;

    color:#022c43;

    margin-bottom:8px;
}

.form-subtitle{
    color:#666;

    font-size:15px;

    margin-bottom:25px;
}

/* FORM GRID */

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;
}

.input-box{
    position:relative;
}

.input-box.full{
    grid-column:1/3;
}

/* INPUTS */

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;

    padding:16px 16px 16px 50px;

    border:none;

    background:#f3f7fb;

    border-radius:14px;

    font-size:15px;

    outline:none;

    transition:0.3s;
}

.input-box textarea{
    height:120px;

    resize:none;
}

.input-box i{
    position:absolute;

    top:18px;
    left:18px;

    color:#00a884;

    font-size:17px;
}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus{
    background:white;

    box-shadow:
    0 0 0 3px rgba(0,168,132,0.2);
}

/* BUTTON */

.submit-btn{
    width:100%;

    margin-top:20px;

    border:none;

    padding:16px;

    border-radius:14px;

    font-size:18px;
    font-weight:bold;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(135deg,#00b894,#005f73);

    position:relative;

    overflow:hidden;

    transition:0.4s;
}

.submit-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.5),
    transparent
    );

    transition:0.7s;
}

.submit-btn:hover::before{
    left:120%;
}

.submit-btn:hover{
    transform:translateY(-3px);

    box-shadow:
    0 8px 20px rgba(0,184,148,0.3);
}

/* MOBILE */

@media(max-width:768px){

body{
    padding:15px;
}

.form-container{
    grid-template-columns:1fr;

    border-radius:20px;
}

.left-panel,
.right-panel{
    padding:25px 18px;
}

.left-panel h1{
    font-size:28px;

    line-height:38px;
}

.left-panel p{
    font-size:14px;

    line-height:24px;
}

.form-title{
    font-size:24px;
}

.form-grid{
    grid-template-columns:1fr;
}

.input-box.full{
    grid-column:1/2;
}

.input-box input,
.input-box select,
.input-box textarea{
    font-size:14px;

    padding:14px 14px 14px 45px;
}

.submit-btn{
    font-size:16px;

    padding:14px;
}

}

</style>

</head>

<body>

<!-- LIGHTS -->

<div class="light light1"></div>
<div class="light light2"></div>

<!-- MAIN -->

<div class="form-container">

    <!-- LEFT -->

    <div class="left-panel">

        <div class="school-badge">

            <i class="fa-solid fa-school"></i>

        </div>

        <h1>
            RDGS Smart
            Enquiry Portal
        </h1>

        <p>
            Fill the enquiry form and connect
            with our school instantly.
        </p>

        <!-- CONTACT -->

        <div class="info-boxes">

            <div class="info-item">

                <i class="fa-solid fa-phone"></i>

                <span>
                    8445718959
                </span>

            </div>

            <div class="info-item">

                <i class="fa-solid fa-envelope"></i>

                <span>
                    rdgs845471@gmail.com
                </span>

            </div>

            <div class="info-item">

                <i class="fa-solid fa-location-dot"></i>

                <span>
                    Awas Vikas Near Water Tank,
                    Badanpur Auraiya
                </span>

            </div>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="right-panel">

        <h2 class="form-title">
            Enquiry Form
        </h2>

        <p class="form-subtitle">
            Please fill all details carefully.
        </p>

        <!-- FORM -->

        <form
        action="https://formspree.io/f/mnjwrrdp"
        method="POST">

            <div class="form-grid">

                <!-- STUDENT -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                    name="student_name"
                    placeholder="Student Name"
                    required>

                </div>

                <!-- PARENT -->

                <div class="input-box">

                    <i class="fa-solid fa-user-tie"></i>

                    <input type="text"
                    name="parent_name"
                    placeholder="Parent Name"
                    required>

                </div>

                <!-- MOBILE -->

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input type="number"
                    name="mobile"
                    placeholder="Mobile Number"
                    required>

                </div>

                <!-- EMAIL -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                    name="email"
                    placeholder="E-mail Address"
                    required>

                </div>

                <!-- CLASS -->

                <div class="input-box full">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <select name="class" required>

                        <option value="">
                            Select Class
                        </option>

                        <option>
                            Nursery
                        </option>

                        <option>
                            Class 1
                        </option>

                        <option>
                            Class 2
                        </option>

                        <option>
                            Class 3
                        </option>

                        <option>
                            Class 4
                        </option>

                        <option>
                            Class 5
                        </option>

                        <option>
                            Class 6
                        </option>

                        <option>
                            Class 7
                        </option>

                        <option>
                            Class 8
                        </option>

                        <option>
                            Class 9
                        </option>

                    </select>

                </div>

                <!-- MESSAGE -->

                <div class="input-box full">

                    <i class="fa-solid fa-message"></i>

                    <textarea
                    name="message"
                    placeholder="Write Your Query Here..."
                    required></textarea>

                </div>

            </div>

            <!-- BUTTON -->

            <button class="submit-btn"
            type="submit">

                <i class="fa-solid fa-paper-plane"></i>

                Submit Enquiry

            </button>

        </form>

    </div>

</div>

</body>


<script>

function submitForm(event){

event.preventDefault();

let popup =
document.getElementById("popup");

popup.classList.add("active");

setTimeout(()=>{

popup.classList.remove("active");

},3000);

}

</script>
</html>
